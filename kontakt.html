<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontakt – Martin Severňák</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="site-header"></header><main>
<div class="wrap page-title"><h1>Kontakt</h1><p>Napiš mi rád/a odpovím.</p></div>
<section class="wrap contact-grid">
  <div class="card"><h2>Kde mě najdeš</h2>
    <ul class="contact-list">
      <li><span class="contact-label">Email:</span><span class="contact-value"><a href="mailto:martin.severnak@seznam.cz">martin.severnak@seznam.cz</a></span></li>
      <li><span class="contact-label">Telefon:</span><span class="contact-value"><a href="tel:+420704408854">+420 704 408 854</a></span></li>
      <li><span class="contact-label">Bydliště:</span><span class="contact-value">Olomouc, Česko (Zelená 580/11)</span></li>
      <li><span class="contact-label">Instagram:</span><span class="contact-value"><a href="https://instagram.com/martas" target="_blank" rel="noreferrer">@Marťas</a></span></li>
      <li><span class="contact-label">GitHub účet:</span><span class="contact-value"><a href="https://github.com/martinsevernak-ui" target="_blank" rel="noreferrer">martinsevernak-ui</a></span></li>
    </ul>
    <p class="muted" style="margin-top:1rem">Pokud ti ještě není 18, neuváděj na webu adresu ani telefon.</p></div>
  <div class="card"><h2>Napiš mi</h2>
    <form id="kform">
      <div class="two"><div><label for="jmeno">Jméno</label><input id="jmeno" name="jmeno" required></div>
      <div><label for="email">E-mail</label><input id="email" name="email" type="email" required></div></div>
      <div><label for="zprava">Zpráva</label><textarea id="zprava" name="zprava" required></textarea></div>
      <button class="btn" type="submit">Odeslat zprávu</button>
    </form></div>
</section>
</main><footer id="site-footer"></footer><script src="js/script.js"></script></body></html>
